name: Release

on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release and upload assets
  checks: write     # test report

jobs:
  release:
    uses: ccswe-apps/actions/.github/workflows/dotnet-release-app.yml@master
    with:
      projects: src/Remote.Adb.Desktop/Remote.Adb.Desktop.csproj src/Remote.Adb.Console/Remote.Adb.Console.csproj
